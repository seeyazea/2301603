<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body{
    height: 100vh; 
    display: flex;
    justify-content: center; 
    align-items: center; 
    font-family: sans-serif; 
    background-color:#060606;
    }
     ul{
    padding:0;
    margin:0;
    display:flex;
    flex-wrap: wrap;
    position: absolute;
    top: 10px; 
    right: 10px; 
}
     ul li{
    list-style:none;
    }
    ul li{
    text-decoration: none;
    color: #3d3d3d;
    font-size: 22px;
    display: block;
    padding: 10px 15px;
    position: relative;
    }
    ul li a:before{
    content:"";
    position: absolute;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 2px; 
    background-color: #87CEEB; 
    transform: scale(0); 
    transform-origin: left; 
    transition: all 0.5s;
    }
    
    ul li a:after{
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px; 
    background-color: #FFC0CB;
    transform: scale(0);
    transform-origin: right;
    transition: all 0.5s;
    }
    li a:hover{
    color:#369ac9;;
    }
    ul li a:hover:before, ul li a:hover:after{
    transform: scaleX(1);
    }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(to bottom right, #87CEEB, #FFC0CB);
        }
        .background-welcome {
            position: fixed;
            top: 11%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .background-welcome h1 {
            font-size: 2em;
            margin: 0;
            line-height: 1.2;
        }
        .login-container {
            background-color: #F8F8FF;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
            margin-top: 50px;
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .social-login {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }

        .social-login i {
            font-size: 40px;
            cursor: pointer;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .login-form label {
            margin-bottom: 8px;
            text-align: left;
        }

        .login-form input {
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 10px;
        }

        .login-form button {
            padding: 15px;
            background-color:#369ac9;
            color: #fff;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        .login-form button:hover {
            background-color: #607cf7;
        }

        .signup-link {
            margin-top: 10px;
        }

        .signup-link p {
            margin-bottom: 10px;
        }

        .signup-link a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <ul>
        <li> <a href="#">Home</a></li>
        <li> <a href="#">About</a></li>
        <li> <a href="#">Course</a></li>
        <li> <a href="#">Contact</a></li>

    </ul>
   
    <div class="background-welcome">
        <h1>안녕하세요<br>Welcome<br>Здравствуйте<br>هالو </h1>
    </div>

    <div class="login-container">
        <h2>Log in to have fun and learn faster</h2>
        <div class="social-login">
            <i class="fab fa-google" title="Log in with Google"></i>
            <i class="fab fa-facebook-square" title="Log in with Facebook"></i>
            <i class="fab fa-apple" title="Log in with Apple"></i>
        </div>

        <h2>or</h2>

        <form class="login-form" action="#" method="post">
            <label for="username">Username or Email:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <div class="forgot-password">
                <a href="#" title="I forgot my password!">I forgot my password!</a>
            </div>


    
            <form class="login-form" method="post">
                <button type="submit" formaction="강좌선택.html">Log in</button>
            </form>
        

        </form>

        <div class="signup-link">
            <p>Don’t have an account? <a href="signup.html" title="Sign up now!">Sign up now!</a></p>
        </div>
    </div>

</body>
</html>
