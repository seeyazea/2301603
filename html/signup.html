<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
     body{
    height: 100vh; 
    display: flex;
    justify-content: center; 
    align-items: center; 
    font-family: sans-serif; 
    background-color:#000000;
    }
     ul{
    padding:0;
    margin:0;
    display:flex;
    flex-wrap: wrap;
    position: absolute;
    top: 10px;
    right: 10px; 
}
     ul li{
    list-style:none;
    }
    ul li{
    text-decoration: none;
    color: #3d3d3d;
    font-size: 22px;
    display: block;
    padding: 10px 15px;
    position: relative;
    }
    ul li a:before{
    content:"";
    position: absolute;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 2px; 
    background-color: #87CEEB; 
    transform: scale(0); 
    transform-origin: left; 
    transition: all 0.5s;
    }
    
    ul li a:after{
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px; 
    background-color: #FFC0CB;
    transform: scale(0);
    transform-origin: right;
    transition: all 0.5s;
    }
    li a:hover{
    color:#369ac9;;
    }
    ul li a:hover:before, ul li a:hover:after{
    transform: scaleX(1);
    }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #87CEEB, #FFC0CB);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .register-container {
            background-color: #F8F8FF;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
            margin-bottom: 20px;
        }

        .register-container h2 {
            color: #333; 
            margin-bottom: 20px;
        }

        .social-signup {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }

        .social-signup i {
            font-size: 47px;
            cursor: pointer;
        }

        .register-form {
            display: flex;
            flex-direction: column;
        }

        .register-form label {
            margin-bottom: 8px;
            text-align: left;
        }

        .register-form input {
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .password-info {
            text-align: left;
            margin-bottom: 20px;
        }

        .password-info ul {
            list-style-type: none;
            padding: 0;
        }

        .password-info li {
            margin-bottom: 5px;
        }

        .register-form button {
            padding: 15px;
            background-color: #369ac9;
            color: #fff;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        .register-form button:hover {
            background-color: #607cf7;
        }

        .signup-link {
            margin-top: 10px;
            text-align: center;
        }

        .signup-link p {
            margin-bottom: 10px;
            color: #333;
        }

        .signup-link a {
            color: #333333;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <ul>
        <li> <a href="#">Home</a></li>
        <li> <a href="#">About</a></li>
        <li> <a href="#">Course</a></li>
        <li> <a href="#">Contact</a></li>

    </ul>
    <div class="register-container">
        <div class="social-signup">
            <i class="fab fa-google" title="Sign up with Google"></i>
            <i class="fab fa-facebook-square" title="Sign up with Facebook"></i>
            <i class="fab fa-apple" title="Sign up with Apple"></i>
        </div>

        <h2>Or sign up with email</h2>

        <form class="register-form" action="#" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <div class="password-info">
                <p>Make sure your password:</p>
                <ul2>
                    <li2> - is 6 characters or longer</li2><br>
                    <li2> - has no spaces</li2>
                </ul2>
            </div>

            <button type="submit">Sign up, it's free</button>
        </form>
    </div>

    <div class="signup-link">
        <p>Already have an account? <a href="login2.html" title="Log in now!">Log in now!</a></p>
    </div>

</body>
</html>
