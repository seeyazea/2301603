<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaTopia</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(to bottom right, #87CEEB, #FFC0CB);
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            width: 100%;
            padding: 3px;
            background: linear-gradient(#c5a0f9, #ec7d73);
        }

        h1 {
            font-size: 30px;
            color: rgb(244, 81, 108);
            margin-top: 0;
        }

        .language-menu {
            margin-bottom: auto;
            margin-top: 0;
        }

        select {
            padding: 8px;
            border: none;
            border-radius: 5px;
            background-color: #fff;
        }

        .buttons {
            margin-bottom: auto;
        }

        .buttons button {
            margin-left: 10px;
            padding: 8px;
            background-color: #fff;
            border: none;
            border-radius: none;
            cursor: pointer;
        }

        .course-container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            margin: 140px auto;
        }

        .course {
            position: relative;
            width: 400px;
            height: 300px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background-size: cover;
            background-position: center;
            transition: background-color 0.3s;
        }

        .course:nth-child(1) {
            background-image: url('kor.png');
        }

        .course:nth-child(2) {
            background-image: url('jap.png');
        }

        .course:nth-child(3) {
            background-image: url('ang.png');
        }

        .course:hover {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            width: 100%;
            text-align: center;
        }

        .course:hover .menu {
            display: block;
        }

        .menu-item {
            margin: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .menu-item:hover {
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
    </style>
</head>

<body>
    

    <header>
        <div class="language-menu">
            <select>
                <option value="korean">한국어</option>
                <option value="japanese">日本語</option>
                <option value="english">English</option>
            </select>
        </div>
        <h1>LinguaTopia</h1>
        <div class="buttons">

            <form class="home-form" method="post">
             <button type="submit" formaction="home.html">홈페이지</button>
            </form>
            <button>로그아웃</button>
        </div>
        
    </header>

    <p style="color: #532169; font-size: 25px; margin-bottom: 50px;">강좌를 선택하세요~</p>
    
    <div class="course-container">
        <div class="course">
            <a>
                한국어
                <div class="menu">
                    <div class="menu-item">어회</div>
                    <div class="menu-item">문법</div>
                    <div class="menu-item">연습</div>
                </div>
            </a>
        </div>

        <div class="course">
            <a>
                일본어
                <div class="menu">
                    <div class="menu-item">어회</div>
                    <div class="menu-item">문법</div>
                    <div class="menu-item">연습</div>
                </div>
            </a>
        </div>

        <div class="course">
            <a>
                영어
                <div class="menu">
                    <div class="menu-item">어회</div>
                    <div class="menu-item">문법</div>
                    <div class="menu-item">연습</div>
                </div>
            </a>
        </div>
    </div>

    <div class="footer">
        <p>All rights reserved</p>
    </div>
</body>

</html>
